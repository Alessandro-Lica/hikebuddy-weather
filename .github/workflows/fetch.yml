name: fetch weather

on:
  schedule:
    # 05, 09, 13, 17, 21 Italian winter time (CET = UTC+1); one hour later in summer (CEST).
    # GitHub may start scheduled runs 5-30 min late.
    - cron: "0 4,8,12,16,20 * * *"
  workflow_dispatch:

permissions:
  contents: write # commit stats/
  pages: write
  id-token: write

concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Fetch the forecast
        run: python3 fetch.py --run "${{ github.run_id }}-${{ github.run_attempt }}"

      - name: Save the call stats
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats
          git diff --cached --quiet && exit 0
          git commit -m "stats: run ${{ github.run_id }}"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  # Separate job (GitHub's Pages pattern): runs only when the fetch succeeded, so a failed run
  # leaves the previous bundle online.
  deploy:
    needs: fetch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
